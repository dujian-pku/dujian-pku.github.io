<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<!-- Based on https://github.com/luost26/academic-homepage -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign current_site_title = page.site_title | default: site.title %}
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ current_site_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#7a1824">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ current_site_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/photos/jian-du.jpg' | absolute_url }}">
  <meta property="og:locale" content="{% if page.locale == 'zh' %}zh_CN{% else %}en_US{% endif %}">
  {% if page.alternate_url %}
  <link rel="alternate" hreflang="{% if page.locale == 'zh' %}en{% else %}zh-CN{% endif %}" href="{{ page.alternate_url | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body class="lang-{{ page.locale | default: 'en' }}">
  {% include navbar.html %}
  <div class="site-shell">
    {{ content }}
  </div>
  {% include footer.html %}
</body>
</html>
