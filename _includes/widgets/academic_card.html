<section class="row mt-3" aria-labelledby="academic-heading">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h3 id="academic-heading" class="card-section-heading">项目与教学 <span class="section-title-en">Projects & Teaching</span></h3>
                <div class="academic-columns">
                    <div>
                        <h4 class="academic-subheading">代表性主持项目</h4>
                        {% for item in site.data.profile.funding %}
                        <article class="academic-item">
                            <div class="academic-meta">{{ item.agency }}{% if item.number != "" %} · {{ item.number }}{% endif %} · {{ item.date }}</div>
                            <div>{{ item.name }}</div>
                        </article>
                        {% endfor %}
                    </div>
                    <div>
                        <h4 class="academic-subheading">课程教学</h4>
                        {% for item in site.data.profile.teaching %}
                        <article class="academic-item">
                            <div class="academic-meta">{{ item.date }}</div>
                            <div>{{ item.name }}</div>
                        </article>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
