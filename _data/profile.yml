research_areas:
- title: 可计算医学知识
  en: Computable Biomedical Knowledge
  description: 将文献中的医学知识转化为可检索、可计算和可执行的知识对象，支持知识复用与决策。
- title: 医学知识图谱与自然语言处理
  en: Medical Knowledge Graphs & NLP
  description: 从生物医学文献和临床研究资源中抽取实体、关系与证据语境，构建可溯源知识网络。
- title: 因果图与证据三角测量
  en: Causal DAGs & Evidence Triangulation
  description: 利用有向无环图组织因果假设，并综合不同研究设计的证据方向、偏倚结构与一致性。
- title: 医学科技大数据分析
  en: Biomedical Science & Technology Analytics
  description: 连接论文、专利、临床试验与疾病负担数据，分析医学知识生产、转化与应用路径。

platforms:
- name: CBK System
  title: 可计算医学知识平台
  url: https://cbk.bjmu.edu.cn/
  description: 面向 SemMedDB 语义三元组的检索、证据回溯、机制路径发现与候选因果图构建。
- name: HNLP System
  title: 医学自然语言处理系统
  url: https://hnlp.bjmu.edu.cn/
  description: 面向医学文本的自然语言处理与知识抽取工具平台。
- name: KG2DAG
  title: 知识图谱辅助因果图构建
  url: https://dag.bjmu.edu.cn/
  description: 基于知识图谱发现暴露与结局之间的候选混杂、中介及对撞变量。

