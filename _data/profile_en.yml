research_areas:
- title: Computable Biomedical Knowledge
  description: Representing findings from the biomedical literature as searchable, computable, and reusable knowledge objects for research and decision support.
- title: Biomedical Knowledge Graphs and Natural Language Processing
  description: Extracting entities, relations, and evidential context from publications and clinical research resources to build traceable knowledge networks.
- title: Causal Diagrams and Evidence Triangulation
  description: Using directed acyclic graphs to formalize causal assumptions and synthesizing the direction, bias structure, and convergence of evidence across study designs.
- title: Biomedical Science and Technology Analytics
  description: Linking publications, patents, clinical trials, and disease-burden data to study how biomedical knowledge is produced, translated, and applied.

