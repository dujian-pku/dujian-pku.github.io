short_bio: >-
  <p>
    Jian Du is a tenured associate professor, researcher, and PhD supervisor at the National Institute of Health Data Science at Peking University, where he leads the Computable Biomedical Knowledge Lab. He joined Peking University Health Science Center in November 2019 after working at the Institute of Medical Information, Chinese Academy of Medical Sciences and Peking Union Medical College.
  </p>
  <p>
    His research examines how biomedical knowledge can be represented, computed, and used in evidence-informed decisions. Current work spans biomedical knowledge graphs, natural language processing, causal diagrams, evidence triangulation, and the analysis of science-to-technology translation.
  </p>

